[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-garment-benchmark"
version = "0.1.0"
description = "Semantic parser and evidence harness for analytic 2D sewing patterns"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "svgpathtools>=1.6",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
]
vision = [
    "opencv-python-headless>=4.8",
]
test = [
    "pytest>=8.0,<10",
    "torch>=2.1",
]
report = [
    "Pillow==12.3.0",
    "python-docx==1.2.0",
]
external = [
    "torchvision>=0.16",
    "trimesh>=4.0",
]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["benchmark/tests"]
