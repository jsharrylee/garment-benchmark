[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-garment-benchmark"
version = "0.1.0"
description = "Semantic parser and evidence harness for analytic 2D sewing patterns"
requires-python = ">=3.10"

[project.optional-dependencies]
report = [
    "Pillow==12.3.0",
    "python-docx==1.2.0",
]

[tool.setuptools.packages.find]
include = ["benchmark*"]
